
services:
  db:
    image: postgres:15-alpine
    container_name: vn_paralympic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: vn_paralympic_sport
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vn_paralympic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vn_paralympic_sport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: vn_paralympic_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-paralympic_redis_2024}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vn_paralympic_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-paralympic_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: vn_paralympic_api
    restart: always
    ports:
      - '3001:3001'
    networks:
      - vn_paralympic_network
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/vn_paralympic_sport?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-paralympic_redis_2024}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-dummy@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-dummy}
      - SMTP_FROM=${SMTP_FROM:-Vietnam ParaSports <noreply@vietnam-parasports.org>}
      - NEXT_PUBLIC_MEDIA_SIGNATURE_SECRET=${NEXT_PUBLIC_MEDIA_SIGNATURE_SECRET}
      - MEDIA_SIGNATURE_SECRET=${MEDIA_SIGNATURE_SECRET}
      - NODE_ENV=production
      - FRONTEND_URL=https://vietnamparasports.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api-server/uploads:/usr/src/app/api-server/uploads
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    container_name: vn_paralympic_web
    restart: always
    ports:
      - '3000:3000'
    networks:
      - vn_paralympic_network
    environment:
      # Use internal docker networking for server-side fetches
      - INTERNAL_API_URL=http://api:3001/api/v1
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NEXT_PUBLIC_MEDIA_SIGNATURE_SECRET=${NEXT_PUBLIC_MEDIA_SIGNATURE_SECRET}
      - MEDIA_SIGNATURE_SECRET=${MEDIA_SIGNATURE_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://vietnamparasports.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
  redis_data:

networks:
  vn_paralympic_network:
    driver: bridge










